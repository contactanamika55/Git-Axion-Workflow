name: First GitHub Actions Workflowv2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
env:
    app_name: Axion-app
    REGION: ${{ vars.AZURE_REGION }}
    KEYVAULT: ${{ vars.KEYVAULT_NAME }}
    SECRET_NAME: DB-PASSWORD

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
  

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name:  verify azure login
        run: |
          az account show

      - name: Discover Key Vault and Secret
        run: |
          set -euo pipefail

          RESOURCE_GROUP="Rg_aks"

          Discover Key Vault directly from Azure
          KEYVAULT_NAME=$(az keyvault list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)

          # if [ -z "$KEYVAULT_NAME" ] || [ "$KEYVAULT_NAME" = "None" ]; then
          #   echo "ERROR: No Key Vault found in $RESOURCE_GROUP"
          #   exit 1
          # fi

           echo "Key Vault discovered: $KEYVAULT_NAME"

           Discover the enabled secret tagged for database password
          SECRET_NAME=$(az keyvault secret list \
            --vault-name "$KEYVAULT_NAME" \
            --query "[?tags.purpose=='db-password' && attributes.enabled==\`true\`].name | [0]" \
            --output tsv)

          # if [ -z "$SECRET_NAME" ] || [ "$SECRET_NAME" = "None" ]; then
          #   echo "ERROR: No enabled secret with purpose=db-password tag found"
          #   exit 1
          #fi

          echo "Secret name discovered: $SECRET_NAME"

          Fetch the actual secret value
          SECRET_VALUE=$(az keyvault secret show \
            --vault-name "$KEYVAULT_NAME" \
            --name "$SECRET_NAME" \
            --query value \
            --output tsv)

          # if [ -z "$SECRET_VALUE" ] || [ "$SECRET_VALUE" = "None" ]; then
          #   echo "ERROR: Secret value unavailable"
          #   exit 1
          # fi

          echo "::add-mask::$SECRET_VALUE"
          printf 'DB_PASSWORD=%s\n' "$SECRET_VALUE" >> "$GITHUB_ENV"

          echo "Key Vault and secret fetched successfully."

          
      - name: Show Repository Information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow started successfully"
          
      - name: Show information
        run: |
          echo "$GITHUB_REF"
          echo "$GITHUB_SHA"
          echo "$GITHUB_ACTOR"

      - name: Validate Execution
        run: |
          echo "Running validation..."
          test -d .git
          echo "Validation successful"
          
      - name:  Show application name
        run: |
           echo "$app_name"

      - name: Show Azure region
        run: |
           echo "$REGION"



    
