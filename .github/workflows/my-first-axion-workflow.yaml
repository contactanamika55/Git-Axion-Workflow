name: First GitHub Actions Workflowv2

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
env:
    app_name: Axion-app
    REGION: ${{ vars.AZURE_REGION }}
    KEYVAULT: ${{ vars.KEYVAULT_NAME }}
    SECRET_NAME: DB-PASSWORD

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest
  

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          auth-type: SERVICE_PRINCIPAL
          creds: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name:  verify azure login
        run: |
          az account show

      - name: Discover Key Vault and Secret
        run: |
          
          RESOURCE_GROUP="Rg_aks"

      
          KEYVAULT_NAME=$(az keyvault list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[0].name" \
            --output tsv)


          echo "Key Vault discovered: $KEYVAULT_NAME"

     
          SECRET_NAME=$(az keyvault secret list \
            --vault-name "$KEYVAULT_NAME" \
            --query "[?tags.purpose=='db-password' && attributes.enabled==\`true\`].name | [0]" \
            --output tsv)



          echo "Secret name discovered: $SECRET_NAME"

          # Fetch the actual secret value
          SECRET_VALUE=$(az keyvault secret show \
            --vault-name "$KEYVAULT_NAME" \
            --name "$SECRET_NAME" \
            --query value \
            --output tsv)

          

          echo "::add-mask::$SECRET_VALUE"
          echo "$SECRET_VALUE"


          
      - name: Show Repository Information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workflow started successfully"
          
      - name: Show information
        run: |
          echo "$GITHUB_REF"
          echo "$GITHUB_SHA"
          echo "$GITHUB_ACTOR"

      - name: Validate Execution
        run: |
          echo "Running validation..."
          test -d .git
          echo "Validation successful"
          
      - name:  Show application name
        run: |
           echo "$app_name"

      - name: Show Azure region
        run: |
           echo "$REGION"

# setup Env Variables
   
      - name: Set environment variable
        run: echo "APP_VERSION=1.2.0" >> "$GITHUB_ENV"

      - name: Read environment variable
        run: echo "Version is $APP_VERSION"

#image build and push to jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      

    steps:
      - name: Generate image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Print image tag
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: echo "Deploying image $IMAGE_TAG"    


#Artifacts and caching


name: Artifact Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create report
        run: |
          mkdir -p output
          echo "Build successful" > output/report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: output/report.txt

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: downloaded

      - name: Display report
        run: cat downloaded/report.txt


    
