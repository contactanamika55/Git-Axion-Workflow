
name: My First CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display message
        run: echo "GitHub Actions pipeline started"

      - name: Check runner
        run: |
          echo "Operating System:"
          uname -s
          echo "Current Directory:"
          pwd

      - name: Simulate test
        run: |
          echo "Running tests..."
          echo "All tests passed"